name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verification:
    name: Verification - unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -e .

      - name: Run verification tests
        run: pytest q_block/tests/verification/ -v

  validation:
    name: Validation - atomic systems tests
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -e .

      - name: Run validation tests
        run: pytest q_block/tests/validation/ -v

  documentation:
    name: Documentation - Sphinx
    needs: validation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install sphinx sphinx-autoapi furo
          pip install -e .

      - name: Build documentation
        run: |
          sphinx-build -b html \
            q_block/learn/documentation/web_page/ \
            q_block/learn/documentation/web_page/_build/html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: q_block/learn/documentation/web_page/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish:
    name: Publish - PyPI
    needs: documentation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qBlock/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bump patch version
        id: bump
        run: |
          python - <<'EOF'
          import re, pathlib, os
          path = pathlib.Path("setup.py")
          content = path.read_text(encoding="utf-8")
          match = re.search(r'PROJECT_VERSION: str = "(\d+)"', content)
          new_version = str(int(match.group(1)) + 1)
          new_content = re.sub(
              r'(PROJECT_VERSION: str = )"(\d+)"',
              f'\\1"{new_version}"',
              content
          )
          path.write_text(new_content, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"new_version={new_version}\n")
          EOF

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add setup.py
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
          print-hash: true

