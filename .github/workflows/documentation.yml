name: Documentation - Sphinx

on:
  push:
    branches: [main]

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install sphinx sphinx-autoapi furo
          pip install -e .

      - name: Build documentation
        run: |
          sphinx-build -b html \
            q_block/learn/documentation/web_page/ \
            q_block/learn/documentation/web_page/_build/html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: q_block/learn/documentation/web_page/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
