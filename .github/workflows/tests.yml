name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verification:
    name: Verification tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -e .

      - name: Run verification tests
        run: pytest q_block/tests/verification/ -v

  validation:
    name: Validation tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -e .

      - name: Run validation tests
        run: pytest q_block/tests/validation/ -v
